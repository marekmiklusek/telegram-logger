<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2735"/>
      <stop offset="55%" stop-color="#22303f"/>
      <stop offset="100%" stop-color="#16202b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1280" height="480" fill="url(#sky)"/>
  <circle cx="1140" cy="70" r="150" fill="#38bdf8" opacity="0.06"/>
  <circle cx="120" cy="430" r="180" fill="#0ea5e9" opacity="0.05"/>

  <g transform="translate(80, 108)">
    <text x="0" y="0" fill="#e2e8f0" font-size="52" font-weight="700" letter-spacing="-0.5">Laravel Telegram Logger</text>
    <rect x="2" y="24" width="86" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="76" fill="#94a3b8" font-size="22" font-weight="400">Laravel logs and exceptions,</text>
    <text x="0" y="108" fill="#94a3b8" font-size="22" font-weight="400">delivered to Telegram in real time.</text>

    <g transform="translate(0, 158)" font-size="15" fill="#64748b">
      <g>
        <circle cx="7" cy="-5" r="3.5" fill="#38bdf8"/>
        <text x="22" y="0">Flood protection</text>
      </g>
      <g transform="translate(0, 30)">
        <circle cx="7" cy="-5" r="3.5" fill="#38bdf8"/>
        <text x="22" y="0">Redacts sensitive context</text>
      </g>
      <g transform="translate(0, 60)">
        <circle cx="7" cy="-5" r="3.5" fill="#38bdf8"/>
        <text x="22" y="0">100% test coverage</text>
      </g>
    </g>
  </g>

  <g transform="translate(690, 96)" filter="url(#lift)">
    <rect width="510" height="288" rx="20" fill="#ffffff"/>

    <g transform="translate(30, 52)">
      <text x="0" y="0" font-size="19">❌</text>
      <text x="34" y="0" fill="#0f172a" font-size="18" font-weight="600">ERROR</text>
      <text x="98" y="0" fill="#cbd5e1" font-size="18">|</text>
      <text x="114" y="0" fill="#0f172a" font-size="18" font-weight="600">Shop</text>
      <text x="168" y="0" fill="#cbd5e1" font-size="18">|</text>
      <text x="184" y="0" fill="#0f172a" font-size="18" font-weight="600">production</text>
    </g>

    <text x="30" y="82" fill="#0f172a" font-size="18" font-weight="700">Payment gateway timed out</text>

    <g transform="translate(30, 124)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14.5">
      <text x="0" y="0" font-size="15" font-family="ui-sans-serif, sans-serif">📍</text>
      <text x="26" y="0" fill="#2563eb">app/Services/Checkout.php:87</text>
      <text x="0" y="26" font-size="15" font-family="ui-sans-serif, sans-serif">🕑</text>
      <text x="26" y="26" fill="#2563eb">16:41:13</text>
    </g>

    <g transform="translate(30, 172)">
      <rect width="450" height="88" rx="10" fill="#eef2f6"/>
      <text x="16" y="24" fill="#64748b" font-size="13" font-family="ui-monospace, monospace">json</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">
        <text x="16" y="48" fill="#b45309">"order_id"</text>
        <text x="96" y="48" fill="#334155">:</text>
        <text x="108" y="48" fill="#be123c">4711</text>
        <text x="16" y="70" fill="#b45309">"gateway"</text>
        <text x="92" y="70" fill="#334155">:</text>
        <text x="104" y="70" fill="#be123c">"stripe"</text>
      </g>
    </g>
  </g>
</svg>
